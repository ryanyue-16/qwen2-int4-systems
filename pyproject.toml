[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-int4-inference"
version = "0.1.0"
description = "Qwen2 W4A16 reference inference with explicit PyTorch and LPU-style backends"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "safetensors>=0.4.3",
  "torch>=2.3",
  "transformers>=4.43,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
qwen-int4-run = "qwen_int4.cli:main"
qwen-int4-inspect = "qwen_int4.inspect_checkpoint:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

